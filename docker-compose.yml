services:

  backend:
    build: .
    container_name: selectilla_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    networks:
      - app-network

  frontend:
    build: /home/nawres/projetPFE/SelectIlLa_front
    container_name: selectilla_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: selectilla_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: selectilla
      MYSQL_USER: strapi_user
      MYSQL_PASSWORD: "Strapi123/*"
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    build: ../SelectIlLa_front
    #image: nginx:alpine
    container_name: selectilla_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../SelectIlLa_front/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  db_data:
  backend_node_modules:

networks:
  app-network:
    driver: bridge