version: '3'

services:

  backend:
    image: selectilla-back
    build: ./SelectIlLa_Backend
    ports:
      - "3000:3000"
    env_file:
      - ./SelectIlLa_Backend/.env.docker
    networks:
      - app-network

  frontend:
    image: selectilla-front
    build: ./SelectIlLa_front
    ports:
      - "82:80"
    env_file:
      - ./SelectIlLa_front/.env
    networks:
      - app-network

networks:
  app-network:
    driver: bridge